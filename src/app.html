<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
		<script>
			try {
				const theme = localStorage.getItem('llm-kitchen:theme');
				if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
				const level = localStorage.getItem('llm-kitchen:level');
				if (level === 'simple' || level === 'deep') document.documentElement.dataset.level = level;
			} catch {}
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
