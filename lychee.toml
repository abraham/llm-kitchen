# Link checker settings (https://lychee.cli.rs), used by .github/workflows/links.yml.

# Publishers' bot protection answers automated checks with 202 (Wiley) or 403 (ACM, APA PsycNet)
# even though the links work in a browser. 429 is rate limiting, not a dead link.
accept = ["200..=299", "403", "429"]

max_retries = 3
timeout = 30
user_agent = "Mozilla/5.0 (compatible; llm-kitchen link check)"

exclude = [
  # Placeholders and local addresses used in examples and docs.
  '^https?://localhost',
  '^https?://(www\.)?catfacts\.example',
  '^https?://example\.com'
]
