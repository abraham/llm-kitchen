name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, type check, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm test

  build-e2e:
    name: Build and Playwright (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # No --with-deps: the runner image already has Chrome's libraries, and apt mirrors can take minutes.
      - run: npx playwright install chromium
      - run: npm run build
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/3
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # No --with-deps: the runner image already has Chrome's libraries, and apt mirrors can take minutes.
      - run: npx playwright install chromium
      - run: npm run build
      - run: npm run test:lighthouse -- --shard=${{ matrix.shard }}/4
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lighthouse-report-${{ matrix.shard }}
          path: lighthouse-report/
          retention-days: 7

  ci-success:
    name: ci-success
    if: always()
    needs: [checks, build-e2e, lighthouse]
    runs-on: ubuntu-latest
    steps:
      - name: All CI jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required CI job did not succeed ($result)."
              exit 1
            fi
          done
