name: Deploy preview

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy preview channel
    # Fork PRs can't get OIDC tokens; they only run CI.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.details_url }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # Deploy with the firebase-tools version in package-lock.json, not the action's default of latest.
      - id: firebase-tools
        run: echo "version=$(node -p "require('firebase-tools/package.json').version")" >> "$GITHUB_OUTPUT"
      # firebase-tools (superstatic) supports Node 20, 22, and 24, and .npmrc sets engine-strict.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - id: wif
        uses: abraham/firebase-wif@v0.2.1
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_WIF_SERVICE_ACCOUNT }}
      - id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ steps.wif.outputs.credentials_json }}
          projectId: ${{ steps.wif.outputs.project_id }}
          channelId: pr-${{ github.event.pull_request.number }}
          expires: 1d
          firebaseToolsVersion: ${{ steps.firebase-tools.outputs.version }}
