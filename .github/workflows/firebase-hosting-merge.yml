name: Deploy live

# The CI ruleset on main requires the ci-success check to pass before a change can merge.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to the live channel
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://llm.kitchen
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # Deploy with the firebase-tools version in package-lock.json, not the action's default of latest.
      - id: firebase-tools
        run: echo "version=$(node -p "require('firebase-tools/package.json').version")" >> "$GITHUB_OUTPUT"
      # firebase-tools (superstatic) supports Node 20, 22, and 24, and .npmrc sets engine-strict.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - id: wif
        uses: abraham/firebase-wif@v0.2.1
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_WIF_SERVICE_ACCOUNT }}
      - uses: FirebaseExtended/action-hosting-deploy@v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ steps.wif.outputs.credentials_json }}
          projectId: ${{ steps.wif.outputs.project_id }}
          channelId: live
          firebaseToolsVersion: ${{ steps.firebase-tools.outputs.version }}
